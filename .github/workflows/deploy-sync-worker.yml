name: Deploy Sync Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "cloud/worker/**"
      - ".github/workflows/deploy-sync-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check deployment secrets
        run: |
          missing=0
          for secret_name in CLOUDFLARE_NAME CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN JWT_SECRET; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing GitHub secret: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create the missing secrets in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_NAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "CLOUDFLARE_NAME must be 1-63 lowercase letters, numbers, or dashes, and cannot start or end with a dash."
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "JWT_SECRET must contain at least 32 characters."
            exit 1
          fi
          if ! [[ "$TURSO_DATABASE_URL" =~ ^libsql://[^/?[:space:]]+\.turso\.io/?$ ]]; then
            echo "::error::TURSO_DATABASE_URL must be the libsql:// URL returned by 'turso db show <database> --url'. Do not use a workers.dev URL."
            exit 1
          fi
          echo "All deployment secrets are present."
          echo "If deploy later fails with authentication code 10000, recreate CLOUDFLARE_API_TOKEN using Cloudflare's Edit Cloudflare Workers token template."
          echo "Required permissions: Account Workers Scripts Edit/Write, Account Settings Read, User Details Read, User Memberships Read."
        env:
          CLOUDFLARE_NAME: ${{ secrets.CLOUDFLARE_NAME || vars.CLOUDFLARE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Apply Turso schema
        run: npm run schema:apply
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy Worker
        run: |
          deploy_output="$RUNNER_TEMP/wrangler-output.jsonl"
          trap 'rm -f .worker-secrets "$deploy_output"' EXIT
          umask 077
          {
            printf 'TURSO_DATABASE_URL=%s\n' "$TURSO_DATABASE_URL"
            printf 'TURSO_AUTH_TOKEN=%s\n' "$TURSO_AUTH_TOKEN"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
          } > .worker-secrets
          export WRANGLER_OUTPUT_FILE_PATH="$deploy_output"
          npx wrangler deploy --name "$CLOUDFLARE_NAME" --secrets-file .worker-secrets

          if [ ! -s "$deploy_output" ]; then
            echo "::error::Wrangler deployed the Worker but did not create its structured deployment report."
            exit 1
          fi
          worker_url="$(jq -sr '[.[] | select(.type == "deploy") | .targets[]? | select(type == "string" and startswith("https://"))] | last // empty' "$deploy_output")"
          if [ -z "$worker_url" ]; then
            echo "::error::Wrangler deployed the Worker but did not report a public target URL. Confirm workers_dev = true and enable the account's workers.dev subdomain."
            exit 1
          fi
          echo "WORKER_URL=$worker_url" >> "$GITHUB_ENV"
          echo "Deployed Worker URL: $worker_url"
        env:
          CLOUDFLARE_NAME: ${{ secrets.CLOUDFLARE_NAME || vars.CLOUDFLARE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Check Worker health
        run: |
          health_file="$RUNNER_TEMP/koinly-worker-health"
          http_status="$(curl --silent --show-error --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$health_file" --write-out '%{http_code}' \
            "$WORKER_URL/health")"

          if ! jq -e 'type == "object"' "$health_file" >/dev/null 2>&1; then
            echo "::error::The deployed Worker returned a non-JSON health response (HTTP $http_status)."
            head -c 1200 "$health_file"
            echo
            if grep -q 'error code: 1042' "$health_file"; then
              echo "::error::Cloudflare 1042 blocked a Worker loop. Confirm TURSO_DATABASE_URL is a libsql://*.turso.io URL, not a workers.dev URL, and remove any same-account proxy route in front of this Worker."
            fi
            exit 1
          fi

          if ! jq -e '.service == "koinly-sync" and .ok == true and .databaseReachable == true and .schemaReady == true' "$health_file" >/dev/null; then
            echo "::error::The deployed Worker is reachable but not healthy (HTTP $http_status)."
            jq -c . "$health_file"
            exit 1
          fi

          echo "### Self-hosted Cloud Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: \`$WORKER_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker health check passed: $WORKER_URL"
