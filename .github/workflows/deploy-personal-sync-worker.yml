name: Deploy Personal No-Login Sync Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/cloudflare-turso/**"
      - ".github/workflows/deploy-personal-sync-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare-turso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/cloudflare-turso/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Check deployment secrets
        run: |
          missing=0
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN SYNC_SECRET; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              missing=1
            fi
          done
          exit "$missing"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}

      - name: Deploy personal Worker
        run: |
          trap 'rm -f .worker-secrets' EXIT
          umask 077
          {
            printf 'TURSO_DATABASE_URL=%s\n' "$TURSO_DATABASE_URL"
            printf 'TURSO_AUTH_TOKEN=%s\n' "$TURSO_AUTH_TOKEN"
            printf 'SYNC_SECRET=%s\n' "$SYNC_SECRET"
          } > .worker-secrets
          npx wrangler deploy --secrets-file .worker-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
